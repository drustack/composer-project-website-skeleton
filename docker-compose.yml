services:

  init:
    image: docker.io/alvistack/devel-24.04:latest
    env_file:
      - ./.env
    command: /var/www/html/scripts/docker-compose-init.sh
    volumes:
      - ./.root/var/lib/mysql:/var/lib/mysql
      - ./.root/var/lib/postgresql/data:/var/lib/postgresql/data
      - ./.root/var/solr:/var/solr
      - ./:/var/www/html

  httpd:
    image: docker.io/alvistack/httpd-2.4:latest
    env_file:
      - ./.env
    volumes:
      - ./.root/etc/apache2/sites-enabled/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
      - ./:/var/www/html
      - /tmp:/tmp
    ports:
      - 80
    depends_on:
      init:
        condition: service_completed_successfully

  php:
    image: docker.io/alvistack/php-8.4-fpm:latest
    env_file:
      - ./.env
    volumes:
      - ./.root/etc/php/fpm/pool.d/www.conf:/etc/php/fpm/pool.d/www.conf
      - ./:/var/www/html
      - /tmp:/tmp
    ports:
      - 9000
    depends_on:
      init:
        condition: service_completed_successfully

  mariadb:
    image: docker.io/alvistack/mariadb-11.8:latest
    env_file:
      - ./.env
    volumes:
      - ./.root/var/lib/mysql:/var/lib/mysql
      - /tmp:/tmp
    ports:
      - 3306
    depends_on:
      init:
        condition: service_completed_successfully

  memcached:
    image: docker.io/memcached:1.6
    env_file:
      - ./.env
    command:
      - /bin/bash
      - -c
      - memcached -m 64
    volumes:
      - /tmp:/tmp
    ports:
      - 11211
    depends_on:
      init:
        condition: service_completed_successfully

  postgres:
    image: docker.io/alvistack/postgres-18:latest
    env_file:
      - ./.env
    volumes:
      - ./.root/var/lib/postgresql/data:/var/lib/postgresql/data
      - /tmp:/tmp
    ports:
      - 5432
    depends_on:
      init:
        condition: service_completed_successfully

  redis:
    image: docker.io/redis:8.6
    env_file:
      - ./.env
    command:
      - /bin/bash
      - -c
      - redis-server --appendonly no --maxmemory 64mb --maxmemory-policy volatile-lru
    volumes:
      - /tmp:/tmp
    ports:
      - 6379
    depends_on:
      init:
        condition: service_completed_successfully

  solr:
    image: docker.io/solr:9.10
    env_file:
      - ./.env
    command:
      - /bin/bash
      - -c
      - solr-precreate default
    volumes:
      - ./modules/contrib/search_api_solr/jump-start/solr9/config-set:/opt/solr/server/solr/configsets/_default/conf
      - ./.root/var/solr:/var/solr
      - /tmp:/tmp
    ports:
      - 8983
    depends_on:
      init:
        condition: service_completed_successfully

  devel:
    image: docker.io/alvistack/devel-24.04:latest
    env_file:
      - ./.env
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /tmp:/tmp
    ports:
      - 22
    depends_on:
      init:
        condition: service_completed_successfully
