---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sshd
  namespace: default
  labels:
    service: sshd
spec:
  replicas: 1
  selector:
    matchLabels:
      service: sshd
  template:
    metadata:
      labels:
        service: sshd
    spec:
      containers:
        - name: sshd
          image: docker.io/alvistack/devel-24.04:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 22
          volumeMounts:
            - mountPath: /var/www/html
              name: var-www-html
      volumes:
        - name: var-www-html
          persistentVolumeClaim:
            claimName: var-www-html
